<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Yega</title>
<meta name="description" content="TV Yega: telefonunuz TV kumandası olur. Turn your phone into a TV remote and air mouse.">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #1b1f27; --muted: #5b6474; --line: #e3e7ee; --accent: #c77a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b111c; --text: #e8eef5; --muted: #9fb0c4; --line: #1f2a3a; --accent: #f29f05; }
  }
  html { background: var(--bg); color: var(--text); }
  body { margin: 0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40em; margin: 0 auto; padding: 40px 16px 64px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; }
  h1 { font-size: 2em; margin: 16px 0 4px; }
  p { color: var(--muted); }
  .links { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 28px; }
  a { color: var(--accent); font-weight: 600; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="TV Yega">
  <h1>TV Yega</h1>
  <p lang="tr">Telefonunuz TV kumandası olur; telefonda bulduğunuz videoları TV'de oynatın.</p>
  <p lang="en">Turn your phone into a TV remote and air mouse, and play the videos you find on your TV.</p>
  <div class="links">
    <a href="https://play.google.com/store/apps/details?id=com.tvyega.app">TV Yega — Google Play</a>
    <a href="https://play.google.com/store/apps/details?id=com.tvyega.tv">TV Yega Receiver (Android TV) — Google Play</a>
    <a href="privacy.html">Gizlilik politikası · Privacy policy</a>
  </div>
  <footer>
    <p><a href="mailto:wp@dizayn16.com.tr">wp@dizayn16.com.tr</a></p>
  </footer>
</main>
</body>
</html>
